version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: quran_db
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
      POSTGRES_DB: quran
    volumes:
      - quran_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: quran_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://quran:quran@db:5432/quran
      SECRET_KEY: dev-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      WHISPER_MODEL: base
      TAJWEED_MODEL: quran-tajweed-correction
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  quran_postgres_data:
